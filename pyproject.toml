[project]
name = "web-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "psycopg2-binary>=2.9.13",
    "pyotp>=2.12.0",
    "python-dotenv>=1.2.4",
    "qrcode>=8.2",
    "requests==2.33.0",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.66.1",
]

[project.scripts]
web-app = "web_app:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
